<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compare board</title>
<style>
  :root{
    color-scheme:dark;
    --paper:#0E1116; --card:#171B22; --ink:#F2F4F8; --ink-2:#A7AFBD; --ink-3:#6E7686; --line:#262C36;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
    --oc:var(--ink-2);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  a{color:inherit}

  /* ---------- the board: one screen per cell, snapping in both directions ---------- */
  #board{
    position:absolute;inset:0;
    display:grid;overflow:auto;scroll-snap-type:both mandatory;
    -ms-overflow-style:none;scrollbar-width:none;
  }
  #board::-webkit-scrollbar{display:none}
  .cell{
    scroll-snap-align:start;scroll-snap-stop:always;position:relative;
    display:flex;flex-direction:column;padding:clamp(70px,9vh,96px) clamp(18px,3vw,40px) clamp(18px,3vw,32px);
  }

  .cell-head{display:flex;align-items:baseline;gap:12px;margin-bottom:14px;flex-shrink:0}
  .cell-head .lbl{margin:0;font-weight:700;font-size:1rem;display:flex;align-items:center;gap:9px}
  .cell-head .lbl .dot{width:9px;height:9px;border-radius:50%;background:var(--oc);flex-shrink:0}
  .cell-head .stage{font-family:var(--mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
  .cell-head a.open{
    font-weight:600;font-size:.78rem;color:var(--ink-2);text-decoration:none;
    border:1px solid var(--line);border-radius:999px;padding:6px 12px;flex-shrink:0;
  }
  .cell-head a.open:hover{color:var(--ink);border-color:var(--ink-2)}

  /* a cell can hold several links; the tabs switch between them */
  .cell-head .figtabs{display:flex;align-items:center;gap:4px;margin-left:auto}
  .cell-head .figtabs button{
    all:unset;box-sizing:border-box;cursor:pointer;font-family:var(--mono);
    font-size:.68rem;color:var(--ink-3);border:1px solid var(--line);border-radius:999px;
    padding:3px 9px;line-height:1.4;transition:color .15s,border-color .15s,background .15s;
  }
  .cell-head .figtabs button:hover{color:var(--ink);border-color:var(--ink-2)}
  .cell-head .figtabs button[aria-current="true"]{color:#fff;background:var(--oc);border-color:var(--oc)}
  .cell-head .figtabs button:focus-visible{outline:2px solid var(--oc);outline-offset:2px}
  .cell-head .figtabs .sep{width:1px;height:14px;background:var(--line);margin:0 3px}

  .frame{
    flex:1;min-height:0;border-radius:14px;overflow:hidden;border:1px solid var(--line);
    background:var(--card);position:relative;
  }
  .frame iframe{width:100%;height:100%;border:0;display:block;background:#fff}
  .frame .fallback{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;text-align:center;padding:24px;color:var(--ink-3);font-family:var(--mono);font-size:.8rem;
  }
  .frame .fallback input{
    width:min(420px,80%);background:var(--paper);border:1px solid var(--line);border-radius:8px;
    color:var(--ink);font-family:var(--mono);font-size:.78rem;padding:9px 12px;
  }
  .frame .fallback input:focus{outline:2px solid var(--oc);outline-offset:1px}
  .frame .fallback button{
    font-weight:600;font-size:.78rem;background:var(--oc);color:#fff;
    border:0;border-radius:999px;padding:8px 16px;cursor:pointer;
  }
  .frame .badge{
    position:absolute;left:12px;top:12px;z-index:2;font-family:var(--mono);font-size:.66rem;
    background:rgba(0,0,0,.55);color:#fff;padding:4px 9px;border-radius:999px;cursor:pointer;
  }

  /* ---------- the overlays that tell you where you are ---------- */
  .nav{position:fixed;z-index:20;display:flex;gap:6px;padding:6px;border-radius:999px;
    background:rgba(23,27,34,.86);border:1px solid var(--line);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
  .nav button{
    all:unset;box-sizing:border-box;cursor:pointer;font-weight:600;font-size:.78rem;
    color:var(--ink-2);padding:8px 14px;border-radius:999px;transition:background .15s,color .15s;
    display:flex;align-items:center;gap:7px;
  }
  .nav button:hover{color:var(--ink)}
  .nav button[aria-current="true"]{background:var(--ink);color:var(--paper)}
  .nav button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  #rowNav{top:16px;left:50%;transform:translateX(-50%)}
  #colNav{top:16px;right:16px}
  /* Long option names make the column nav reach across the middle, where the row
     nav is, and a click meant for a row lands on a column. Shorten the column
     labels rather than move the bar: a second line would cover the cell head,
     where the link tabs are. */
  #colNav .short{display:none}
  #colNav.tight .full{display:none}
  #colNav.tight .short{display:inline}
  #rowNav.tight .lbl-text{display:none}
  #rowNav.tight button::after{content:attr(data-n);font-variant-numeric:tabular-nums}
  #colNav button .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

  .brand{position:fixed;top:16px;left:16px;z-index:20;display:flex;align-items:center;gap:9px;
    font-weight:700;font-size:.9rem;text-decoration:none}

  /* jump between sibling boards without going back to an index */
  .pages{position:fixed;left:16px;bottom:16px;z-index:60;display:flex;gap:6px;padding:6px;border-radius:999px;
    background:rgba(23,27,34,.86);border:1px solid var(--line);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
  .pages a{
    font-weight:600;font-size:.76rem;text-decoration:none;color:var(--ink-2);
    padding:7px 13px;border-radius:999px;transition:background .15s,color .15s;
  }
  .pages a:hover{color:var(--ink)}
  .pages a[aria-current="page"]{background:var(--ink);color:var(--paper)}
  .pages a:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  @media (max-width:640px){ .pages{bottom:auto;top:56px} }

  .hint{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:20;
    font-family:var(--mono);font-size:.7rem;color:var(--ink-3);background:rgba(23,27,34,.7);
    padding:6px 14px;border-radius:999px;border:1px solid var(--line);pointer-events:none;
    transition:opacity .4s}
  .hint.gone{opacity:0}

  @media (max-width:760px){
    #rowNav .lbl-text{display:none}
    .cell{padding-top:64px}
    .cell-head{flex-wrap:wrap}
  }
</style>
</head>
<body>

<a class="brand" id="brand" href="#"></a>
<nav class="pages" id="pages" aria-label="Boards"></nav>
<div class="nav" id="rowNav" role="group" aria-label="Stage"></div>
<div class="nav" id="colNav" role="group" aria-label="Option"></div>
<p class="hint" id="hint"></p>
<div id="board"></div>

<script src="board.config.js"></script>
<script>
(function(){
  var CFG = window.BOARD;
  if(!CFG){ document.body.textContent = 'board.config.js did not load.'; return; }

  var FIG_KEY = CFG.storageKey || 'compare-board-';
  var rows = CFG.rows || [], cols = CFG.columns || [];

  /* ---------- build the page out of the config ---------- */
  if(CFG.title) document.title = CFG.title;

  /* A theme is custom properties, set before anything is drawn, so a board can
     look like the project it belongs to without a second copy of this file. */
  if(CFG.theme) Object.keys(CFG.theme).forEach(function(k){
    document.documentElement.style.setProperty('--' + k, CFG.theme[k]);
  });

  var brand = document.getElementById('brand');
  if(CFG.brand && CFG.brand.label){
    /* the logo is the project's own markup, so it is written as given rather
       than escaped; a config file is code, and this one is yours */
    if(CFG.brand.logo) brand.innerHTML = CFG.brand.logo;
    brand.appendChild(document.createTextNode(CFG.brand.label));
    brand.href = CFG.brand.href || '#';
  }
  else brand.remove();

  /* the boards either side of this one, if it belongs to a set */
  var pages = document.getElementById('pages');
  if(CFG.pages && CFG.pages.length){
    CFG.pages.forEach(function(p){
      var a = document.createElement('a');
      a.textContent = p.label;
      a.href = p.href || '#';
      if(p.here) a.setAttribute('aria-current', 'page');
      pages.appendChild(a);
    });
  }
  else pages.remove();
  var hint = document.getElementById('hint');
  hint.textContent = CFG.hint || 'Scroll in any direction, or use the arrow keys';

  var board = document.getElementById('board');
  /* 100% of the scroll container, not 100vw/100vh: a viewport unit counts the
     scrollbar gutter that the container's own width leaves out, so the cells
     drift a scrollbar's width per column and the snap points stop matching. */
  board.style.gridTemplateColumns = 'repeat(' + cols.length + ',100%)';
  board.style.gridTemplateRows = 'repeat(' + rows.length + ',100%)';

  var rowNav = document.getElementById('rowNav'), colNav = document.getElementById('colNav');
  rows.forEach(function(r, i){
    var b = document.createElement('button');
    b.type = 'button';
    b.innerHTML = '<span class="lbl-text"></span>';
    b.dataset.n = ('0' + (i + 1));
    b.querySelector('.lbl-text').textContent = ('0' + (i + 1)) + ' · ' + r.label;
    rowNav.appendChild(b);
  });
  cols.forEach(function(c){
    var b = document.createElement('button');
    b.type = 'button';
    b.title = c.label;
    var dot = document.createElement('span');
    dot.className = 'dot';
    if(c.colour) dot.style.background = c.colour;
    var full = document.createElement('span');
    full.className = 'full';
    full.textContent = c.label;
    /* What to show when there is no room for the whole name: the config's own
       short form, or the part of the label before its separator — "Option B ·
       Attentive Orientation" shortens to "Option B", not to "Option". */
    var short = document.createElement('span');
    short.className = 'short';
    short.textContent = c.short || c.label.split(/\s*[\u00b7\u2013\u2014:|]\s*/)[0].trim() || c.label;
    b.appendChild(dot); b.appendChild(full); b.appendChild(short);
    colNav.appendChild(b);
  });

  rows.forEach(function(r, ri){
    cols.forEach(function(c, ci){
      var spec = (CFG.cells || {})[r.id + '/' + c.id] || {};
      var cell = document.createElement('section');
      cell.className = 'cell';
      cell.dataset.row = String(ri);
      cell.dataset.colIndex = String(ci);
      cell.dataset.col = c.id;
      if(c.colour) cell.style.setProperty('--oc', c.colour);

      var head = document.createElement('div');
      head.className = 'cell-head';
      var h = document.createElement('h2');
      h.className = 'lbl';
      h.innerHTML = '<span class="dot"></span>';
      h.appendChild(document.createTextNode(c.label));
      var stage = document.createElement('span');
      stage.className = 'stage';
      stage.textContent = r.label;
      head.appendChild(h); head.appendChild(stage);

      var frame = document.createElement('div');
      frame.className = 'frame';
      if(spec.src){ frame.dataset.src = spec.src; frame.dataset.badge = spec.badge || spec.src; }
      else frame.dataset.fig = r.id + '/' + c.id;
      if(spec.figma && spec.figma.length) frame.dataset.figLinks = spec.figma.join(' ');

      cell.appendChild(head); cell.appendChild(frame);
      board.appendChild(cell);
    });
  });

  /* Keep the two nav bars off each other. Measured rather than guessed at a
     breakpoint, because how wide they are depends on how long the labels are. */
  function overlapping(){
    var rn = rowNav.getBoundingClientRect(), cn = colNav.getBoundingClientRect();
    return rn.right > cn.left && cn.right > rn.left && rn.bottom > cn.top && cn.bottom > rn.top;
  }
  function fitNav(){
    colNav.classList.remove('tight');
    rowNav.classList.remove('tight');
    if(!rowNav.querySelector('button') || !colNav.querySelector('button')) return;
    if(!overlapping()) return;
    colNav.classList.add('tight');       /* first give up the column names */
    if(!overlapping()) return;
    rowNav.classList.add('tight');       /* then the row names, leaving their numbers */
  }
  /* Measure again whenever the bars change size for any reason. A web font
     arriving is the one that matters: it lands after the first measurement and
     makes every label wider, so a board that fitted at load stops fitting. */
  var fitting = false, queued = 0;
  function refit(){
    if(fitting) return;
    cancelAnimationFrame(queued);
    queued = requestAnimationFrame(function(){ fitting = true; fitNav(); fitting = false; });
  }
  addEventListener('resize', refit);
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(refit);
  if(window.ResizeObserver){
    var ro = new ResizeObserver(refit);
    ro.observe(rowNav); ro.observe(colNav);
  }

  var rowBtns = [].slice.call(rowNav.querySelectorAll('button'));
  var colBtns = [].slice.call(colNav.querySelectorAll('button'));
  var row = 0, col = 0;

  /* ---------- moving about ---------- */
  function go(r, c){
    r = Math.max(0, Math.min(rows.length - 1, r));
    c = Math.max(0, Math.min(cols.length - 1, c));
    var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    var left = c * board.clientWidth, top = r * board.clientHeight;
    try{ board.scrollTo({ left: left, top: top, behavior: reduce ? 'auto' : 'smooth' }); }
    catch(e){ board.scrollLeft = left; board.scrollTop = top; }
    /* Belt and braces. A smooth scroll can stall (a backgrounded tab pauses the
       frames it needs) or stop a few pixels short, and one check at a fixed
       delay lands mid-animation and proves nothing. So watch until the position
       stops changing, then put it exactly where it should be. */
    var last = -1, tries = 0;
    clearInterval(go.watch);
    go.watch = setInterval(function(){
      var now = board.scrollLeft + board.scrollTop * 1e-3;
      var arrived = Math.abs(board.scrollLeft - left) <= 1 && Math.abs(board.scrollTop - top) <= 1;
      /* say where we are as well as go there: a scroll event is the usual way
         the nav finds out, and some browsers coalesce or drop them */
      if(arrived || ++tries > 12){ clearInterval(go.watch); sync(); return; }
      if(now === last){                     /* it has settled, and not where we asked */
        board.scrollLeft = left; board.scrollTop = top;
        clearInterval(go.watch);
        sync();
        return;
      }
      last = now;
    }, 150);
  }
  rowBtns.forEach(function(b, i){ b.addEventListener('click', function(){ go(i, col); }); });
  colBtns.forEach(function(b, i){ b.addEventListener('click', function(){ go(row, i); }); });

  function sync(){
    row = Math.round(board.scrollTop / board.clientHeight);
    col = Math.round(board.scrollLeft / board.clientWidth);
    rowBtns.forEach(function(b, i){ b.setAttribute('aria-current', String(i === row)); });
    colBtns.forEach(function(b, i){ b.setAttribute('aria-current', String(i === col)); });
  }
  var t = 0;
  board.addEventListener('scroll', function(){
    clearTimeout(t); t = setTimeout(sync, 60);
    if(!hint.classList.contains('gone')) hint.classList.add('gone');
  }, { passive:true });
  sync();
  fitNav();

  window.addEventListener('keydown', function(e){
    if(e.target.tagName === 'INPUT') return;            /* let someone type a link in peace */
    if(e.key === 'ArrowRight') go(row, col + 1);
    else if(e.key === 'ArrowLeft') go(row, col - 1);
    else if(e.key === 'ArrowDown') go(row + 1, col);
    else if(e.key === 'ArrowUp') go(row - 1, col);
    else return;
    e.preventDefault();
  });

  /* ---------- what goes in a frame ---------- */
  function figEmbedUrl(link){
    return 'https://www.figma.com/embed?embed_host=share&url=' + encodeURIComponent(link);
  }
  /* A cell may hold more than one link. Saved as a JSON array; a single string
     from an older version still reads fine. */
  function readLinks(frame, key){
    var raw;
    try{ raw = localStorage.getItem(FIG_KEY + key); }catch(e){}
    if(raw){
      if(raw.charAt(0) === '['){
        try{ var a = JSON.parse(raw); if(Array.isArray(a) && a.length) return a.filter(Boolean); }catch(e){}
      }
      else return [raw];
    }
    /* nothing saved in this browser: the links the config shipped, so anyone
       opening the published board sees the boards too */
    return (frame.dataset.figLinks || '').split(/\s+/).filter(Boolean);
  }
  function savedLinks(key){
    var raw;
    try{ raw = localStorage.getItem(FIG_KEY + key); }catch(e){}
    if(!raw) return [];
    if(raw.charAt(0) === '['){
      try{ var a = JSON.parse(raw); return Array.isArray(a) ? a.filter(Boolean) : []; }catch(e){ return []; }
    }
    return [raw];
  }
  function writeLinks(key, links){
    try{
      if(links.length) localStorage.setItem(FIG_KEY + key, JSON.stringify(links));
      else localStorage.removeItem(FIG_KEY + key);
    }catch(e){}
  }
  function openLink(head, url){
    if(!head) return;
    var a = head.querySelector('a.open');
    if(!a){
      a = document.createElement('a');
      a.className = 'open'; a.target = '_blank'; a.rel = 'noopener';
      a.textContent = 'Open in new tab ↗';
      head.appendChild(a);
    }
    a.href = url;
  }
  function tabs(head, frame, key, links, idx){
    if(!head) return;
    var old = head.querySelector('.figtabs');
    if(old) old.remove();
    var wrap = document.createElement('div');
    wrap.className = 'figtabs';
    /* one link needs no tab to switch to; + and − still show */
    if(links.length > 1) links.forEach(function(link, i){
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = String(i + 1);
      b.title = link;
      b.setAttribute('aria-current', i === idx ? 'true' : 'false');
      b.addEventListener('click', function(){ render(frame, key, i); });
      wrap.appendChild(b);
    });
    if(links.length > 1){
      var sep = document.createElement('span');
      sep.className = 'sep';
      wrap.appendChild(sep);
    }
    var add = document.createElement('button');
    add.type = 'button'; add.textContent = '+'; add.title = 'Add another link';
    add.addEventListener('click', function(){ render(frame, key, links.length, true); });
    wrap.appendChild(add);
    var drop = document.createElement('button');
    drop.type = 'button'; drop.textContent = '−'; drop.title = 'Remove the link on screen';
    drop.addEventListener('click', function(){
      var mine = savedLinks(key);
      if(mine.length){
        /* drop what this browser saved; the shipped link comes back underneath */
        mine.splice(Math.min(idx, mine.length - 1), 1);
        writeLinks(key, mine);
        render(frame, key, Math.max(0, idx - 1));
        return;
      }
      /* nothing of mine to drop: shipped links are the config's, so say so
         rather than pretending to edit the file */
      drop.title = 'This link comes from board.config.js';
      drop.textContent = '−';
    });
    wrap.appendChild(drop);
    head.insertBefore(wrap, head.querySelector('a.open'));
  }
  /* idx picks which of the cell's links to show; addMode asks for a new one even
     when links are already there */
  function render(frame, key, idx, addMode){
    var links = readLinks(frame, key);
    idx = Math.min(Math.max(idx || 0, 0), Math.max(links.length - 1, 0));
    var head = frame.parentElement && frame.parentElement.querySelector('.cell-head');
    if(links.length && !addMode){
      var link = links[idx];
      openLink(head, link);
      tabs(head, frame, key, links, idx);
      var ifr = document.createElement('iframe');
      ifr.loading = 'lazy';
      ifr.allowFullscreen = true;
      ifr.src = figEmbedUrl(link);
      ifr.title = key + ' ' + (idx + 1);
      frame.innerHTML = '';
      frame.appendChild(ifr);
      var badge = document.createElement('span');
      badge.className = 'badge';
      badge.title = 'Click to replace this link, in this browser';
      badge.textContent = links.length > 1 ? (idx + 1) + '/' + links.length + ' ✎' : 'Figma ✎';
      badge.addEventListener('click', function(){
        var mine = savedLinks(key);
        if(mine.length){ mine.splice(Math.min(idx, mine.length - 1), 1); writeLinks(key, mine); }
        render(frame, key, idx, true);
      });
      frame.appendChild(badge);
      return;
    }
    var wrap = document.createElement('div');
    wrap.className = 'fallback';
    wrap.innerHTML =
      '<span>' + (links.length ? 'Paste another link' : 'Paste a Figma link') + '</span>' +
      '<input type="url" placeholder="https://www.figma.com/proto/..." />' +
      '<button type="button">Save</button>';
    var input = wrap.querySelector('input');
    var btn = wrap.querySelector('button');
    btn.addEventListener('click', function(){
      var v = input.value.trim();
      if(!v) return;
      var next = savedLinks(key).concat([v]);
      writeLinks(key, next);
      render(frame, key, next.length - 1);
    });
    input.addEventListener('keydown', function(e){ if(e.key === 'Enter') btn.click(); });
    if(links.length) tabs(head, frame, key, links, -1);
    frame.innerHTML = '';
    frame.appendChild(wrap);
  }

  function mount(frame){
    if(frame.dataset.src){
      var ifr = document.createElement('iframe');
      ifr.loading = 'lazy';
      ifr.src = frame.dataset.src;
      ifr.title = frame.dataset.badge || 'page';
      var badge = document.createElement('span');
      badge.className = 'badge';
      badge.textContent = frame.dataset.badge || '';
      badge.style.cursor = 'default';
      var head = frame.parentElement.querySelector('.cell-head');
      openLink(head, frame.dataset.src);
      frame.appendChild(ifr);
      frame.appendChild(badge);
      return;
    }
    if(frame.dataset.fig) render(frame, frame.dataset.fig);
  }

  /* Load a cell when you reach it, so a board of twelve embeds does not open
     twelve at once. A percentage rootMargin is unreliable across browsers, so
     check what is on screen now directly and leave the observer for the rest. */
  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(en){
      if(!en.isIntersecting) return;
      mount(en.target);
      io.unobserve(en.target);
    });
  }, { rootMargin: '400px' });
  [].forEach.call(document.querySelectorAll('.frame'), function(f){
    var r = f.getBoundingClientRect();
    if(r.width > 0 && r.top < window.innerHeight && r.top > -window.innerHeight &&
       r.left < window.innerWidth && r.left > -window.innerWidth) mount(f);
    else io.observe(f);
  });
})();
</script>
</body>
</html>
